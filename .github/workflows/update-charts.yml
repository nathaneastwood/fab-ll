name: Update charts

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build charts and data
        run: uv run fab_class_charts.py --readme README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update charts for $(date -u +%Y-%m-%d)"
            git push
          fi
